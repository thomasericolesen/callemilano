<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: one reading column; each candidate is a row with a three-way choice and a note. */
:root{--bg:#f6f4f0;--card:#fffdf9;--ink:#24211c;--muted:#6b6459;--line:#e2dccf;--accent:#1f6f6a;--yes:#2f7d4a;--no:#a3453a;--maybe:#a77a1c;
--display:"Fraunces",Georgia,serif;--body:"Source Sans 3",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171613;--card:#211f1b;--ink:#ece6da;--muted:#a59d8e;--line:#36322b;--accent:#5fb3ab;--yes:#6cc28a;--no:#e0857a;--maybe:#e0b45a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171613;--card:#211f1b;--ink:#ece6da;--muted:#a59d8e;--line:#36322b;--accent:#5fb3ab;--yes:#6cc28a;--no:#e0857a;--maybe:#e0b45a;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:600 2rem/1.15 var(--display);margin:0 0 6px;text-wrap:balance}
h2{font:600 1.25rem/1.3 var(--display);margin:34px 0 10px;text-wrap:balance}
.lede{color:var(--muted);max-width:65ch;margin:0}
.status{display:flex;flex-wrap:wrap;gap:8px 16px;margin:16px 0 0;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.status b{color:var(--ink)}
.list{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.name{font-weight:600;min-width:0}
.meta{color:var(--muted);font-size:.9rem;min-width:0}
.meta a{color:var(--accent)}
.choice{display:flex;gap:6px}
.choice label{border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:.9rem;user-select:none}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.choice label.on-ja{border-color:var(--yes);color:var(--yes);font-weight:600}
.choice label.on-nej{border-color:var(--no);color:var(--no);font-weight:600}
.choice label.on-maaske{border-color:var(--maybe);color:var(--maybe);font-weight:600}
textarea{width:100%;box-sizing:border-box;min-height:2.2em;resize:vertical;font:inherit;font-size:.92rem;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.saved{font-size:.8rem;color:var(--muted);min-height:1em}
.banner{margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:.92rem;color:var(--muted)}

details.assess{border-top:1px dashed var(--line);padding-top:6px}
details.assess summary{cursor:pointer;color:var(--accent);font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;margin-top:8px}
.grid label.f{display:grid;gap:2px;font-size:.82rem;color:var(--muted)}
.grid select{font:inherit;font-size:.9rem;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px}
fieldset{border:1px solid var(--line);border-radius:6px;margin:8px 0 0;padding:6px 10px;min-width:0}
fieldset legend{font-size:.82rem;color:var(--muted);padding:0 4px}
fieldset label{display:inline-block;margin:2px 12px 2px 0;font-size:.9rem;white-space:nowrap}
.hint{font-size:.8rem;color:var(--muted);margin:6px 0 0}
</style>
<div class="wrap">
<h1>{{HEADING}}</h1>
<p class="lede">{{LEDE}}</p>
<div class="status" id="status"><span>Indlæser dine tidligere valg …</span></div>
<div class="banner" id="banner" hidden></div>
<div id="groups"></div>
</div>
<script>
const GROUPS = {{GROUPS}};
const LAB = {ja:"Ja",nej:"Nej",maaske:"Måske"};
const CATS=["Restaurants","Beaches","Excursions","Nature","City","Family activities"];
const LV=[["low","Lav"],["medium","Middel"],["high","Høj"],["unknown","Ukendt"]];
const YN=[["unknown","Ukendt"],["yes","Ja"],["partial","Delvist"],["no","Nej"]];
const AGES=[["Small children (0-6)","Små børn 0-6"],["Children (7-12)","Børn 7-12"],["Young adults","Unge voksne"],["Seniors","Seniorer"]];
const SCORES=[["small_children","Små børn"],["children","Børn"],["young_adults","Unge voksne"],["seniors","Seniorer"]];
const ENERGY=[["Low","Lav"],["Medium","Middel"],["High","Høj"]];
const TAGS=["Beach","Restaurant","Nature","Hiking","Viewpoint","Historic town","Museum","Adventure","Rainy day","Half day","Full day","Overnight","Free","Premium"];
const SEAS=["Spring","Summer","Autumn","Winter","All year"];
const state = {};
const total = GROUPS.reduce((n,g)=>n+g.items.length,0);
const byId = {}; GROUPS.forEach(g=>g.items.forEach(i=>{i._grp=g; byId[i.id]=i;}));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opts=(arr,v)=>arr.map(([k,l])=>`<option value="${k}"${k===v?" selected":""}>${l}</option>`).join("");
const cbs=(name,arr,vals)=>arr.map(a=>{const k=Array.isArray(a)?a[0]:a,l=Array.isArray(a)?a[1]:a;return `<label><input type="checkbox" data-f="${name}" value="${esc(k)}"${(vals||[]).includes(k)?" checked":""}> ${esc(l)}</label>`}).join("");
function vals(id){ const p=byId[id].prop||{}; const s=state[id]||{};
  return {category:s.category??p.category, scores:{...(p.scores||{}),...(s.scores||{})}, age_groups:s.age_groups??p.age_groups??[], energy:s.energy??p.energy, tags:s.tags??p.tags??[], seasons:s.seasons??p.seasons??[], dog:s.dog??p.dog??"unknown", wheelchair:s.wheelchair??p.wheelchair??"unknown"}; }
function assessHtml(it){ const v=vals(it.id);
  return `<details class="assess"><summary>Vurdering (forslag er Claudes gæt ud fra stedtype, ikke kilder)</summary>
  <div class="grid"><label class="f">Kategori<select data-f="category">${opts(CATS.map(c=>[c,c]),v.category)}</select></label>
  ${SCORES.map(([k,l])=>`<label class="f">Familiescore: ${l}<select data-f="score-${k}">${opts(LV,v.scores[k])}</select></label>`).join("")}
  <label class="f">Aktivitetsniveau<select data-f="energy">${opts(ENERGY,v.energy)}</select></label>
  <label class="f">Hundevenlig<select data-f="dog">${opts(YN,v.dog)}</select></label>
  <label class="f">Kørestolsvenlig<select data-f="wheelchair">${opts(YN,v.wheelchair)}</select></label></div>
  <fieldset><legend>Aldersgrupper</legend>${cbs("age_groups",AGES,v.age_groups)}</fieldset>
  <fieldset><legend>Tags</legend>${cbs("tags",TAGS,v.tags)}</fieldset>
  <fieldset><legend>Sæson</legend>${cbs("seasons",SEAS,v.seasons)}</fieldset>
  <p class="hint">Hund og kørestol kræver officiel kilde eller din viden; Ukendt er et gyldigt svar.</p></details>`; }
function render(){
  const root=document.getElementById("groups"); root.innerHTML="";
  for(const g of GROUPS){
    const h=document.createElement("h2"); h.textContent=g.key+". "+g.da; root.appendChild(h);
    const list=document.createElement("div"); list.className="list";
    for(const it of g.items){
      const el=document.createElement("div"); el.className="item"; el.dataset.id=it.id;
      const links=[it.maps?`<a href="${esc(it.maps)}" target="_blank" rel="noopener">Kort</a>`:"",it.site?`<a href="${esc(it.site)}" target="_blank" rel="noopener">Hjemmeside</a>`:""].filter(Boolean).join(" · ");
      el.innerHTML=`<div class="top"><div class="name">${esc(it.name)}</div>
        <div class="choice" role="radiogroup" aria-label="Valg for ${esc(it.name)}">${Object.keys(LAB).map(k=>`<label><input type="radio" name="c-${it.id}" id="c-${it.id}-${k}" value="${k}"><span>${LAB[k]}</span></label>`).join("")}</div></div>
        <div class="meta">${esc(it.what)}${it.drive?" · "+esc(it.drive)+" i bil":""}${links?" · "+links:""}${it.note?"<br>"+esc(it.note):""}</div>
        ${assessHtml(it)}
        <textarea id="n-${it.id}" placeholder="Note (valgfri)" aria-label="Note til ${esc(it.name)}"></textarea><div class="saved" aria-live="polite"></div>`;
      list.appendChild(el);
    }
    root.appendChild(list);
  }
}
function paint(id){
  const s=state[id]||{}; const el=document.querySelector(`.item[data-id="${id}"]`); if(!el) return;
  el.querySelectorAll(".choice label").forEach(l=>{const v=l.querySelector("input").value; l.className=s.choice===v?"on-"+v:""; l.querySelector("input").checked=s.choice===v;});
  const ta=el.querySelector("textarea"); if(document.activeElement!==ta) ta.value=s.note||"";
  if(el.contains(document.activeElement)&&document.activeElement.dataset.f) return;
  const open=el.querySelector("details").open; const d=el.querySelector("details"); const tmp=document.createElement("div"); tmp.innerHTML=assessHtml(byId[id]);
  const nd=tmp.firstElementChild; nd.open=open; d.replaceWith(nd);
}
function counts(){
  const c={ja:0,nej:0,maaske:0}; for(const k in state){ if(c[state[k].choice]!==undefined) c[state[k].choice]++; }
  const done=c.ja+c.nej+c.maaske;
  document.getElementById("status").innerHTML=`<span><b>${done}</b> af ${total} besvaret</span><span>Ja <b>${c.ja}</b></span><span>Måske <b>${c.maaske}</b></span><span>Nej <b>${c.nej}</b></span>`;
}
render(); counts();
(async()=>{
  const banner=document.getElementById("banner");
  const timer=setTimeout(()=>{banner.hidden=false;banner.textContent="Kunne ikke hente gemte valg endnu. Du kan stadig vælge; prøv at genindlæse siden senere.";},10000);
  const db = window.claude ? await window.claude.use("db") : null;
  if(!db){clearTimeout(timer);banner.hidden=false;banner.textContent="Valg kan ikke gemmes i denne visning. Åbn siden logget ind på claude.ai for at gemme.";document.querySelectorAll("input,textarea,select").forEach(x=>x.disabled=true);return;}
  const col=db.collection("choices");
  col.onSnapshot(snap=>{clearTimeout(timer);banner.hidden=true;
    for(const d of snap.docs){ state[d.id]=d.data(); paint(d.id); } counts();
  }, err=>{clearTimeout(timer);banner.hidden=false;banner.textContent="Kunne ikke hente gemte valg: "+(err&&err.message||"ukendt fejl");});
  const timers={};
  async function save(id){
    const el=document.querySelector(`.item[data-id="${id}"]`); const s=el.querySelector(".saved");
    const choice=(el.querySelector(".choice input:checked")||{}).value||null; const note=el.querySelector("textarea").value.trim();
    const g=n=>[...el.querySelectorAll(`input[data-f="${n}"]:checked`)].map(x=>x.value);
    const sel=n=>el.querySelector(`select[data-f="${n}"]`).value;
    const scores={}; SCORES.forEach(([k])=>scores[k]=sel("score-"+k));
    const doc={choice,note,category:sel("category"),scores,age_groups:g("age_groups"),energy:sel("energy"),tags:g("tags"),seasons:g("seasons"),dog:sel("dog"),wheelchair:sel("wheelchair")};
    state[id]=doc; counts(); s.textContent="Gemmer …";
    try{ await col.doc(id).set({...doc,updated:new Date().toISOString()}); s.textContent="Gemt"; }
    catch(e){ s.textContent="Ikke gemt: "+(e&&e.message||"fejl"); }
  }
  const root=document.getElementById("groups");
  root.addEventListener("change",e=>{const it=e.target.closest(".item"); if(it&&(e.target.type==="radio"||e.target.dataset.f)) save(it.dataset.id);});
  root.addEventListener("input",e=>{const it=e.target.closest(".item"); if(it&&e.target.tagName==="TEXTAREA"){clearTimeout(timers[it.dataset.id]); timers[it.dataset.id]=setTimeout(()=>save(it.dataset.id),900);}});
})();
</script>
